services:
  app:
    build:
      context: .
      args:
        ADS_ENABLED: ${ADS_ENABLED:-true}
        NEXT_PUBLIC_LEGAL_OPERATOR_NAME: ${NEXT_PUBLIC_LEGAL_OPERATOR_NAME:-VideoDownloader}
        NEXT_PUBLIC_LEGAL_CONTACT_EMAIL: ${NEXT_PUBLIC_LEGAL_CONTACT_EMAIL:-privacy@findtoolpdf.online}
        NEXT_PUBLIC_LEGAL_POSTAL_ADDRESS: ${NEXT_PUBLIC_LEGAL_POSTAL_ADDRESS:-Vietnam}
        NEXT_PUBLIC_MONETAG_VIGNETTE_ZONE_ID: ${NEXT_PUBLIC_MONETAG_VIGNETTE_ZONE_ID:-12238810}
        NEXT_PUBLIC_MONETAG_VIGNETTE_SCRIPT_URL: ${NEXT_PUBLIC_MONETAG_VIGNETTE_SCRIPT_URL:-https://n6wxm.com/vignette.min.js}
        NEXT_PUBLIC_MONETAG_IN_PAGE_PUSH_ZONE_ID: ${NEXT_PUBLIC_MONETAG_IN_PAGE_PUSH_ZONE_ID:-12238840}
        NEXT_PUBLIC_MONETAG_IN_PAGE_PUSH_SCRIPT_URL: ${NEXT_PUBLIC_MONETAG_IN_PAGE_PUSH_SCRIPT_URL:-https://nap5k.com/tag.min.js}
        NEXT_PUBLIC_ADCASH_INTERSTITIAL_ZONE_ID: ${NEXT_PUBLIC_ADCASH_INTERSTITIAL_ZONE_ID:-12435318}
        NEXT_PUBLIC_ADSTERRA_HEADER_SCRIPT_URL: ${NEXT_PUBLIC_ADSTERRA_HEADER_SCRIPT_URL:-}
        NEXT_PUBLIC_ADSTERRA_HEADER_CONTAINER_ID: ${NEXT_PUBLIC_ADSTERRA_HEADER_CONTAINER_ID:-}
        NEXT_PUBLIC_ADSTERRA_LEFT_RAIL_SCRIPT_URL: ${NEXT_PUBLIC_ADSTERRA_LEFT_RAIL_SCRIPT_URL:-}
        NEXT_PUBLIC_ADSTERRA_LEFT_RAIL_CONTAINER_ID: ${NEXT_PUBLIC_ADSTERRA_LEFT_RAIL_CONTAINER_ID:-}
        NEXT_PUBLIC_ADSTERRA_RIGHT_RAIL_SCRIPT_URL: ${NEXT_PUBLIC_ADSTERRA_RIGHT_RAIL_SCRIPT_URL:-}
        NEXT_PUBLIC_ADSTERRA_RIGHT_RAIL_CONTAINER_ID: ${NEXT_PUBLIC_ADSTERRA_RIGHT_RAIL_CONTAINER_ID:-}
        NEXT_PUBLIC_ADSTERRA_INPUT_SCRIPT_URL: ${NEXT_PUBLIC_ADSTERRA_INPUT_SCRIPT_URL:-}
        NEXT_PUBLIC_ADSTERRA_INPUT_CONTAINER_ID: ${NEXT_PUBLIC_ADSTERRA_INPUT_CONTAINER_ID:-}
        NEXT_PUBLIC_ADSTERRA_DOWNLOAD_MODAL_SCRIPT_URL: ${NEXT_PUBLIC_ADSTERRA_DOWNLOAD_MODAL_SCRIPT_URL:-}
        NEXT_PUBLIC_ADSTERRA_DOWNLOAD_MODAL_CONTAINER_ID: ${NEXT_PUBLIC_ADSTERRA_DOWNLOAD_MODAL_CONTAINER_ID:-}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADS_ENABLED: ${ADS_ENABLED:-true}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
