services:
  app:
    build:
      context: .
      args:
        ADS_ENABLED: ${ADS_ENABLED:-false}
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADS_ENABLED: ${ADS_ENABLED:-false}
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
